services:
  - type: web
    name: datainvest-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATAINVEST_PRODUCTION
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

